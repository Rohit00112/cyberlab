name: cyberlab-prod

# Production deployment. Overrides/extends docker-compose.yml (docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build).
# All services run production images; only Caddy publishes ports (80/443).
services:
  security-core:
    environment:
      SECURITY_CORE_DATABASE_URL: postgres://cyberlab_security_core:${SECURITY_CORE_DB_PASSWORD:?Set a URL-safe password for Rust's read-only DB role}@postgres:5432/cyberlab
      SECURITY_CORE_WRITE_DATABASE_URL: postgres://cyberlab_security_writer:${SECURITY_CORE_WRITE_DB_PASSWORD:?Set a URL-safe password for Rust's write DB role}@postgres:5432/cyberlab

  # Run once after Alembic schema migrations, and after each permission-
  # relevant schema change. Not part of the normal application startup.
  security-core-role-init:
    profiles: [maintenance]
    image: postgres:16-alpine
    # Roll back every grant if a permission or schema check fails.
    command: ["psql", "-X", "--single-transaction", "-v", "ON_ERROR_STOP=1", "-h", "postgres", "-U", "${POSTGRES_USER}", "-d", "cyberlab", "-f", "/setup/security-core-role.sql"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      SECURITY_CORE_DB_PASSWORD: ${SECURITY_CORE_DB_PASSWORD:?Set a URL-safe password for Rust's read-only DB role}
      SECURITY_CORE_WRITE_DB_PASSWORD: ${SECURITY_CORE_WRITE_DB_PASSWORD:?Set a URL-safe password for Rust's write DB role}
    volumes:
      - ./infrastructure/docker/security-core-role.sql:/setup/security-core-role.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cyberlab
    volumes: !override
      - pgdata:/var/lib/postgresql/data
      # Fresh production volumes initialize only the Keycloak database.
      # The developer-only cyberlab_test database must never be created here.
      - ./infrastructure/docker/postgres-init/01-create-keycloak-db.sql:/docker-entrypoint-initdb.d/01-create-keycloak-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
    ports: !override []      # never expose DB on the host in prod

  redis:
    ports: !override []

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: ["start", "--proxy-headers=xforwarded", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: auth.example.org
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: 8080
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "true"
    healthcheck:
      # Probe the configured public host, not dev's localhost Host header.
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /realms/cyberlab/.well-known/openid-configuration HTTP/1.0\\r\\nHost: %s\\r\\n\\r\\n\" \"$$KC_HOSTNAME\" >&3; grep -Eq \"^HTTP/[0-9.]+ 200\" <&3'",
        ]
    volumes:
      - ./infrastructure/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ./infrastructure/keycloak/themes/cyberlab:/opt/keycloak/themes/cyberlab:ro
    ports: !override []

  api:
    build:
      context: ./apps/api
      target: prod
    command: ["sh", "-c", "python -m scripts.verify_config && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --workers 2"]
    env_file: .env
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/cyberlab
      REDIS_URL: redis://redis:6379/0
      OIDC_ISSUER_URL: https://auth.example.org/realms/cyberlab
      OIDC_WELL_KNOWN_URL: https://auth.example.org/realms/cyberlab/.well-known/openid-configuration
      OIDC_CLIENT_ID: api
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      RUST_CORE_URL: http://security-core:8081
      RUST_CORE_SHARED_TOKEN: ${RUST_CORE_SHARED_TOKEN:?Set a 32+ character Rust core token in .env}
    volumes: !override
      # Docker socket remains a separate hardening gap; do not break provisioning here.
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/research:/app/data/research
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: unless-stopped
    ports: !override []

  web:
    build:
      context: ./apps/web
      target: prod
    command: !override ["node", "server.js"]
    environment:
      NEXT_PUBLIC_API_BASE: https://cyberlab.example.org/api/v1
      NEXT_PUBLIC_KEYCLOAK_ISSUER: https://auth.example.org/realms/cyberlab
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: web
      NEXT_PUBLIC_WEB_ORIGIN: https://cyberlab.example.org
      KEYCLOAK_INTERNAL_ISSUER: http://keycloak:8080/realms/cyberlab
      API_INTERNAL_BASE: http://api:8000/api/v1
      CI: "true"
    depends_on:
      - api
    volumes: !override []
    restart: unless-stopped
    ports: !override []

  celery-worker:
    build:
      context: ./apps/api
      target: prod
    command: ["celery", "-A", "app.worker:celery_app", "worker", "--beat", "--loglevel=info"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/cyberlab
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes: !override
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/research:/app/data/research
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
