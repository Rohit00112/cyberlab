[project]
name = "cyberlab-api"
version = "0.1.0"
description = "IIC CyberLab API — backend for the cybersecurity training platform"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.1",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "pyjwt[crypto]>=2.9",
    "PyYAML>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.7",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

# Long test-data literals / legacy formations predate the 100-char lint; kept
# as-is to avoid churning older fixtures. New code must stay lint-clean.
[tool.ruff.lint.per-file-ignores]
"app/services/skill_profiles.py" = ["E501"]
"app/services/labs.py" = ["F401"]
"tests/test_recommendations.py" = ["E501"]
"tests/test_endpoints_adaptive.py" = ["E501"]
"tests/test_learning_paths.py" = ["E501"]
"tests/test_skill_profile.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]